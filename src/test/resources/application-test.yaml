spring:
  datasource:
    url: jdbc:h2:mem:forum;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      # As migrações Flyway criam o schema em memória. A validação de tipos é feita contra o MySQL real.
      ddl-auto: none

  flyway:
    enabled: true

security:
  jwt:
    secret: test-only-secret-with-at-least-32-characters-1234567890
    expiration-minutes: 5

logging:
  level:
    "[org.hibernate.SQL]": warn
